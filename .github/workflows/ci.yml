name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Policy, model, and native core
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check repository policy and scripts
        run: |
          ./scripts/check.sh
          shellcheck -x scripts/*.sh tests/*.sh
      - name: Build and test without libmdr
        run: ./scripts/build.sh --without-libmdr
      - name: Test native source installation lifecycle
        run: ./tests/installers.test.sh

  full-backend:
    name: Pinned Bluetooth backend
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: pacman -Syu --needed --noconfirm base-devel bluez bluez-libs cmake dbus git jq nodejs pkgconf
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build and test pinned hardware backend
        run: ./scripts/build.sh
