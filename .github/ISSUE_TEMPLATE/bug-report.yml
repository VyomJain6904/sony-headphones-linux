name: Bug report
description: Report a reproducible plugin, service, or installation problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include Bluetooth addresses, private device names, account data, or unredacted protocol captures. Security vulnerabilities belong in GitHub's private vulnerability reporting flow, not a public issue.
  - type: input
    id: version
    attributes:
      label: Plugin version or commit
      placeholder: v0.2.0 or a full commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Omarchy, Quickshell, Qt, BlueZ, and distribution versions.
    validations:
      required: true
  - type: textarea
    id: device
    attributes:
      label: Headphone evidence
      description: If hardware-related, include exact model, firmware, transport, and reported MDR protocol generation.
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and redacted logs
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed Bluetooth addresses, private device names, account data, and other personal identifiers.
          required: true
